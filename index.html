<html lang="en">

<style>
:root{--bg:#f5f5f6;--sf:#fff;--sf2:#ececef;--tx:#111114;--mu:#5a5a64;--ln:rgba(0,0,0,.13);--red:#d90b16;--ok:#0f9d62;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070707;--sf:#101012;--sf2:#1b1b1f;--tx:#f6f6f7;--mu:#a0a0aa;--ln:rgba(255,255,255,.11);--red:#ff2a34;--ok:#56d69a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070707;--sf:#101012;--sf2:#1b1b1f;--tx:#f6f6f7;--mu:#a0a0aa;--ln:rgba(255,255,255,.11);--red:#ff2a34;--ok:#56d69a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Barlow',system-ui,sans-serif}
.wrap{max-width:720px;margin:auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{font:20px 'Russo One',Impact,sans-serif;letter-spacing:2px}.logo b{color:var(--red);font-size:1.3em;line-height:0;vertical-align:-.06em}.logo small{display:block;font:600 11px 'Barlow',sans-serif;letter-spacing:2px;color:var(--mu);text-transform:uppercase}
nav{display:flex;gap:4px;background:var(--sf2);padding:4px;border-radius:12px}
nav button{border:0;background:none;color:var(--mu);padding:8px 16px;border-radius:9px;font-weight:700;cursor:pointer}
nav button.on{background:var(--red);color:#fff}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:18px;margin-bottom:12px}
h2,h3{font-family:'Russo One',Impact,sans-serif;margin:0 0 8px;text-transform:uppercase;font-weight:400}h2{font-size:22px}h3{font-size:15px}
.muted,.fine{color:var(--mu);font-size:13px}.fine{text-align:center;margin:18px 0}
.sl{display:block;margin:14px 0}.sl span{display:flex;justify-content:space-between;font-weight:700}.sl b{color:var(--red)}
input[type=range]{width:100%;accent-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 14px}
.chip{border:1px solid var(--ln);background:var(--sf2);color:var(--tx);padding:9px 13px;border-radius:999px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:700;letter-spacing:.5px;cursor:pointer;background:var(--red);color:#fff;font-size:15px}
.btn.ghost{background:var(--sf2);color:var(--tx)}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.hd{display:flex;gap:16px;align-items:center}.score{font:52px/1 'Russo One',Impact,sans-serif;color:var(--red)}
.bar{height:6px;background:var(--sf2);border-radius:9px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.ex{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--ln)}
.ex.on strong{text-decoration:line-through;opacity:.6}
.tick{width:40px;height:40px;border-radius:12px;border:2px solid var(--ln);background:none;color:transparent;font-size:20px;cursor:pointer}
.on .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.ex strong{display:block}.ex span{display:block;color:var(--mu);font-size:13px}.ex em{font-style:normal;color:var(--red);font-weight:700;font-size:13px}
.ex .lv{display:block;margin-top:3px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mu)}
.nm{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:700;text-align:left;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}.nm i{font-style:normal;color:var(--red);font-size:.8em}.ex.on .nm{text-decoration:line-through}
.qt{font-size:19px;line-height:1.45;font-weight:600;margin:6px 0 8px}.qa{color:var(--mu);font-size:14px;margin:0}
.qcard{border-left:4px solid var(--red)}
.inst{display:flex;gap:12px;align-items:flex-start;border-left:4px solid var(--red)}.inst h3{margin:0 0 4px}.inst p{margin:0 0 6px}.inst .x{margin-left:auto;background:none;border:0;color:var(--mu);font-size:20px;cursor:pointer;padding:0 4px}
.vm{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:14px;z-index:50}.vm[hidden]{display:none}
.vc{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:18px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:16px;position:relative}
.vc h3{padding-right:50px}.vx{position:absolute;top:10px;right:10px;border:0;background:var(--sf2);color:var(--tx);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer}
.vf{display:block;aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000}.vc video{display:block;width:100%;border-radius:12px;background:#000}.vc a.btn{display:inline-block;text-decoration:none}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.sc button{border:1px solid var(--ln);background:var(--sf2);color:var(--tx);border-radius:14px;padding:12px 2px;font-weight:700;cursor:pointer}
.sc button span{display:block;font:22px 'Russo One',Impact,sans-serif}.sc button small{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
.sc button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}.sc button[aria-pressed=true] small{color:#fff}
.stepbar{height:5px;background:var(--sf2);border-radius:9px;overflow:hidden;margin:2px 0 12px}.stepbar i{display:block;height:100%;background:var(--red);transition:width .3s}
.acts{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}.btn.off{opacity:.4;pointer-events:none}
.felt{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.felt span{background:var(--sf2);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}.felt b{color:var(--red)}
.wsug{display:block;margin-top:3px;font-size:12px;color:var(--mu)}.wsug b{color:var(--tx)}
.exr input.w{width:78px}
.pt{border-collapse:collapse;margin:8px 0;font-size:14px}.pt th,.pt td{padding:4px 18px 4px 0;border-bottom:1px solid var(--ln);text-align:left}
details{margin-top:12px}summary{cursor:pointer;font-weight:700}
.hb{padding:9px 16px;font-size:14px}
.exr{display:flex;gap:6px;align-items:center}.exr input{width:58px;padding:8px;border-radius:9px;border:1px solid var(--ln);background:var(--sf2);color:var(--tx)}
.exr button{border:0;background:var(--sf2);color:var(--tx);width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:var(--sf2);border-radius:14px;padding:12px 6px;text-align:center}.stat b{display:block;font:24px 'Russo One',Impact,sans-serif}.stat span{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:1px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.heat i{aspect-ratio:1;border-radius:6px;background:var(--sf2)}.heat i.p{background:color-mix(in srgb,var(--red) 35%,var(--sf2))}.heat i.f{background:var(--ok)}
.spark{width:100%;height:70px;color:var(--red)}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--ln);font-size:14px}
textarea{width:100%;height:90px;background:var(--sf2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px;margin:8px 0}
.up{color:var(--ok);font-weight:600}
@media(max-width:480px){.ex{grid-template-columns:40px 1fr}.exr{grid-column:2}.stats{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo"><span role="img" aria-label="Momentum">M<b>☻</b>MENTUM</span><small id="sub">Daily Mission</small></div>
<nav role="tablist" aria-label="Sections"><button role="tab" data-a="tab" data-v="today">Today</button><button role="tab" data-a="tab" data-v="prog">Progress</button></nav><button id="who" class="chip" data-a="logout" hidden>Sign out</button></header>
<main id="app" aria-live="polite"></main>
<p class="fine">Momentum offers educational fitness guidance, not medical advice, diagnosis or treatment. Stop any exercise that causes sharp, worsening or unusual pain, and check with your doctor before starting a new program.</p>
</div>
<div id="qm" class="vm" hidden data-a="qclose"><div class="vc" role="dialog" aria-modal="true" aria-label="Quote"><p class="muted" style="margin:0 0 6px;letter-spacing:2px;font-size:12px">MINDSET</p><p id="qtx" class="qt"></p><p id="qau" class="qa"></p><button class="btn" data-a="qclose" style="margin-top:16px;width:100%">Keep going</button></div></div>
<div id="vm" class="vm" hidden data-a="vback"><div class="vc" role="dialog" aria-modal="true" aria-labelledby="vt"><button class="vx" data-a="vclose" aria-label="Close video">✕</button><h3 id="vt"></h3><div id="vb"></div><p id="vq" class="muted"></p></div></div>
<script>
const KEY="momentum.v2",$=s=>document.querySelector(s);
const LIB=`
// ======================  EXERCISE LIBRARY  ======================
// TO ADD AN EXERCISE, add one line in this format:
//     Name | equipment | joints it loads | unit | coaching cue | rep range (optional) | load (optional)
//
// equipment : bw db band kb bench bb hex bar
//             comma = either one (db,kb)   plus = needs both (db+bench)
// joints    : neck shoulder back hip knee ankle wrist
//             (a person with pain there will not be given this move)
// unit      : r = reps   rs = reps each side   s = seconds   ss = seconds each side   m = slow mobility reps
// range     : like 5-8. If left off: 8-12 reps, 6-10 each side, 20-45 seconds
// load      : load = show a weight box for this move, noload = never show one.
//             If left off, moves that need db, kb, bb or hex get a weight box automatically.
//
// LADDERS go from easiest (top) to hardest (bottom). Put a new step where it belongs.
// A line starting with # starts a new group:   # id | pattern | Title | ladder   (or list = no steps)
// patterns the workouts use: mob push pull vpull hinge squat core
// Every exercise name must be unique.

# push | push | Horizontal push | ladder
Incline Push-Up | bw | shoulder,wrist | r | Hands on a bench or wall, body long, elbows controlled.
Push-Up | bw | shoulder,wrist | r | One straight line from head to heels, chest to a fist above the floor.
Feet-Elevated Push-Up | bw | shoulder,wrist | r | Feet on a step, ribs down, hips do not sag.
Clap Push-Up | bw | shoulder,wrist | r | Push fast, land softly with bent elbows. Quality over reps. | 4-8
DB Floor Press | db | shoulder,wrist | r | Elbows about 45 degrees, light pause on the floor.
DB Bench Press | db+bench | shoulder,wrist | r | Feet planted, shoulder blades pinned back.
Incline DB Press | db+bench | shoulder,wrist | r | Low incline, press up and slightly back.
Barbell Bench Press | bb+bench | shoulder,wrist | r | Use a spotter or safety arms. Bar to mid-chest. | 5-8
Incline Barbell Bench Press | bb+bench | shoulder,wrist | r | Use a spotter or safety arms. Control the bar down. | 5-8

# pull | pull | Horizontal pull | ladder
Prone Y-T-W | bw | shoulder,neck,back | r | Move from the shoulder blades, thumbs up, no shrugging.
Seated Band Row | band | shoulder,wrist | r | Sit tall, pull elbows toward the ribs.
1/4 Squat Band Row | band | shoulder,knee | r | Hold a small squat while you row, chest tall.
Inverted Row | bar | shoulder,wrist | r | Bar at waist height, body straight, pull chest to the bar.
Bent-Over DB Row | db | back,shoulder,wrist | r | Flat back, pull the elbow to the hip.
Bent-Over Barbell Row | bb | back,shoulder,wrist | r | Hinge, brace, pull the bar to the lower ribs. | 5-8
Renegade Row | db | shoulder,wrist,back | rs | Wide feet, hips square, row without rotating. | 4-8

# vpull | vpull | Vertical pull | ladder
Seated Band Pull-Down | band | shoulder | r | Band anchored overhead, pull elbows to your ribs.
Flexed-Arm Hang | bar | shoulder,wrist | s | Chin over the bar, hold still with shoulders down. | 10-30
Scap Pull-Up | bar | shoulder | r | Hang and pull the shoulder blades down without bending the elbows. | 6-12
Eccentric Pull-Up | bar | shoulder | r | Jump to the top, lower for 3 to 5 seconds. | 3-6
Pull-Up | bar | shoulder | r | Full hang to chin over the bar, no kipping. | 3-8

# hip | hinge | Hip dominant | ladder
Glute Bridge | bw | hip | r | Finish with the glutes, not the low back.
Single-Leg Glute Bridge | bw | hip,knee | rs | Keep the hips level.
Feet-Elevated Glute Bridge | bw | hip | r | Heels on a step, drive up and squeeze.
Feet-Elevated Single-Leg Glute Bridge | bw | hip,knee | rs | Heel on a step, hips level, no twisting.
Hip Thrust | bench | hip | r | Upper back on the bench, chin tucked, pause at the top.
Barbell Glute Bridge | bb | hip | r | Bar over the hips with a pad, drive through the heels. | 6-10
Barbell Hip Thrust | bb+bench | hip | r | Bar over the hips with a pad, ribs down at the top. | 6-10
Single-Leg Reaching RDL | bw | back,hip,ankle | rs | Reach long, hips square, soft knee.
KB Single-Leg RDL | kb | back,hip,ankle | rs | Hips square, bell close, long spine. | 6-10
Barbell RDL | bb | back,hip | r | Hips back, bar close to the legs. | 6-10
Dumbbell RDL | db | back,hip | r | Hips back, weights close, flat back.
KB Deadlift | kb | back,hip,knee | r | Brace first, then push the floor away.
Hex-Bar Deadlift | hex | back,hip,knee | r | Brace, push the floor away, stand tall. | 5-8
Conventional Deadlift | bb | back,hip,knee | r | Bar over mid-foot, tight lats, push the floor away. | 3-6
Sumo Deadlift | bb | back,hip,knee | r | Wide stance, chest up, spread the floor. | 3-6
Snatch-Grip Deadlift | bb | back,hip,knee,shoulder | r | Wide grip, long back, controlled lowering. | 3-6
Single-Arm DB Snatch | db | back,hip,shoulder,wrist | rs | Hip drive does the work, punch through at the top. | 3-6

# squat | squat | Knee dominant | ladder
Isometric Split Squat | bw | knee,hip,ankle | ss | Hold the bottom position, front foot flat. | 15-30
Arms-on-Wall Squat | bw | knee,hip,ankle | r | Hands on a wall for balance, sit down and back.
Prisoner Squat | bw | knee,hip,ankle | r | Hands behind the head, chest tall.
Single-Leg Box Squat | bw | knee,hip,ankle | rs | Sit back to a box on one leg, control the whole way. | 4-8
Bodyweight Split Squat | bw | knee,hip,ankle | rs | Back knee straight down, front foot grounded.
Goblet Squat | db,kb | knee,hip,ankle | r | Stay tall and drive through the whole foot.
Rear-Foot-Elevated Split Squat | bench | knee,hip,ankle | rs | Back foot on a bench, torso tall, front foot grounded. | 6-10
Overhead Squat | bb | shoulder,back,knee,hip,ankle | r | Bar locked out overhead, ribs down. Learn it with a dowel first. | 3-6

# mob | mob | Mobility | list
Cat-Cow Flow | bw | wrist | m | Move slowly with your breath.
World’s Greatest Stretch | bw | knee,hip,wrist | m | Own each position and never force range.
90/90 Hip Switch | bw | hip,knee | m | Rotate through the hips with control.
Open Book Rotation | bw | shoulder | m | Keep hips stacked as the chest turns.
Ankle Rocking | bw | ankle,knee | m | Heel stays planted.
Chin Tuck Reset | bw | neck | m | Glide the chin straight back, no strain.
Wall Slide | bw | shoulder,neck | m | Ribs down, stay pain-free.
Half-Kneeling Hip Flexor Stretch | bw | hip,knee | m | Squeeze the glute on the kneeling side.
Thread the Needle | bw | shoulder,wrist,knee | m | Rotate through the upper back.
Supine Figure-4 Stretch | bw | hip | m | Relax into it and breathe slowly.
90/90 Breathing | bw | | m | Legs on a chair, slow exhale, ribs down.

# core | core | Core | list
Dead Bug | bw | | r | Low back gently connected to the floor.
Bird Dog | bw | wrist,knee,shoulder | r | Reach long without rotating.
Pallof Press | band | shoulder | rs | Resist rotation as the hands press out.
Suitcase Hold | db,kb | back,wrist | ss | Stay tall and do not lean.
Forearm Side Plank | bw | shoulder | ss | Stack the hips in one long line.
`;
const LADS=[],EX=[];
LIB.split("\n").forEach(raw=>{const line=raw.trim();if(!line||line.startsWith("//"))return;
 if(line[0]==="#"){const[id,pat,title,kind]=line.slice(1).split("|").map(x=>x.trim());LADS.push({id,pat,title,ladder:kind==="ladder",steps:[]});return}
 const g=LADS[LADS.length-1];if(!g)return;
 const[name,eq,jt,unit,cue,rg,fl]=line.split("|").map(x=>x.trim());
 const e={name,pat:g.pat,lad:g.ladder?g.id:null,eq:(eq||"bw").split(",").map(x=>x.split("+").map(y=>y.trim())),jt:jt?jt.split(",").map(x=>x.trim()):[],unit:unit||"r",cue:cue||""};e.load=fl==="noload"?false:fl==="load"?true:e.eq.some(g=>g.some(x=>["db","kb","bb","hex"].includes(x)));
 const R=rg?rg.split("-").map(Number):null,df={r:[8,12],rs:[6,10],s:[20,45],ss:[15,30],m:[8,8]}[e.unit]||[8,12];
 e.lo=R?R[0]:df[0];e.hi=R?R[1]:df[1];EX.push(e);g.steps.push(e)});
const ex=n=>EX.find(e=>e.name===n),UL={r:"reps",rs:"reps each side",s:"sec",ss:"sec each side",m:"slow reps"};
const VIDEOS=`
// ======================  EXERCISE VIDEOS  ======================
// One line per exercise:    Exercise Name | video link
// The name must match the library above exactly.
// The link can be a YouTube link (watch, youtu.be or shorts), an 11-character YouTube ID,
// or a link to an .mp4 file (an https address, or a file in this site such as videos/push-up.mp4).
// Exercises without a line get a "Find a demo on YouTube" button instead.
//
// Example:   Push-Up | https://youtu.be/XXXXXXXXXXX

`;
const VID={};VIDEOS.split("\n").forEach(raw=>{const l=raw.trim();if(!l||l.startsWith("//"))return;const i=l.indexOf("|");if(i<0)return;const n=l.slice(0,i).trim(),u=l.slice(i+1).trim();if(n&&u)VID[n]=u});
function vidInfo(u){u=(u||"").trim();if(!u)return null;
 const m=u.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#\s]*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
 if(m)return{yt:m[1]};
 if(/^[\w-]{11}$/.test(u))return{yt:u};
 if(/\.(mp4|webm|mov)(\?.*)?$/i.test(u)&&(u.startsWith("https://")||!/^[a-z][a-z0-9+.-]*:/i.test(u)))return{file:u};
 return null}
let vOpener=null;
function openVid(name,opener){const e=ex(name);if(!e)return;vOpener=opener;$("#vt").textContent=e.name;
 const v=vidInfo(VID[name]),box=$("#vb");box.innerHTML="";
 if(v&&v.yt){const f=document.createElement("iframe");f.className="vf";f.src="https://www.youtube-nocookie.com/embed/"+v.yt+"?rel=0&modestbranding=1&playsinline=1";f.title=e.name+" demo video";f.allow="encrypted-media; picture-in-picture; fullscreen";f.allowFullscreen=true;box.appendChild(f)}
 else if(v&&v.file){const m=document.createElement("video");m.src=v.file;m.controls=true;m.playsInline=true;m.loop=true;m.preload="metadata";box.appendChild(m)}
 else{const a=document.createElement("a");a.className="btn";a.target="_blank";a.rel="noopener";a.href="https://www.youtube.com/results?search_query="+encodeURIComponent(e.name+" exercise form");a.textContent="Find a demo on YouTube";box.appendChild(a)}
 $("#vq").textContent=e.cue;$("#vm").hidden=false;document.body.style.overflow="hidden";$(".vx").focus()}
function closeVid(){$("#vb").innerHTML="";$("#vm").hidden=true;document.body.style.overflow="";if(vOpener&&vOpener.focus)vOpener.focus()}
addEventListener("keydown",ev=>{if(ev.key==="Escape"){if(!$("#qm").hidden)closeQ();else if(!$("#vm").hidden)closeVid()}});
const PCT=[[1,100],[3,93],[5,85],[7,77],[10,67],[12,62],[15,58],[20,50]],LB=2.2046226218;
const fmt=v=>String(Math.round(v*10)/10),isKg=()=>S.set.units==="kg",toU=kg=>isKg()?kg:kg*LB,fromU=v=>isKg()?v:v/LB;
function pct(r){r=Math.max(1,Math.min(20,Math.round(r)));for(let i=1;i<PCT.length;i++){const[a,pa]=PCT[i-1],[b,pb]=PCT[i];if(r<=b)return pa+(pb-pa)*(r-a)/(b-a)}return 50}
function wtInfo(n){const h=((S.wt||{})[n]||{}).h||[],last=h[h.length-1]||null,es=h.filter(x=>x.e).slice(-3).map(x=>x.e),cur=es.length?Math.max(...es):null,pr=h.reduce((m,x)=>x.e&&x.e>m?x.e:m,0);return{h,last,cur,pr}}
function sugW(cur,t){const k=isKg(),v=toU(cur*pct(t)/100),inc=v<(k?10:25)?(k?1:2.5):(k?2.5:5);return Math.max(inc,Math.round(v/inc)*inc)}
function wtSuggestHTML(e,t){const u=isKg()?"kg":"lb",i=wtInfo(e.name),L=i.last,hold=e.unit==="s"||e.unit==="ss";
